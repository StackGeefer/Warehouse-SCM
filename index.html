<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Warehouse</title>
  <meta name="description" content="Cari material, cek stok Zona 1, pilih RO/BAU dan buat Call Order ke MIM.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
        </div>
        <div>
          <div class="brand-title">Material Warehouse</div>
          <div class="brand-sub">Call Order Field Rantau · Zona 1</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/cari" data-route="cari">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="lbl">Cari Material</span>
        </a>
        <a href="#/kontrak" data-route="kontrak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          <span class="lbl">Kontrak (OA/RO)</span>
        </a>
        <a href="#/call-order" data-route="call-order">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10M9 12h10M9 19h10"/><path d="m3 5 1.5 1.5L7 4M3 12l1.5 1.5L7 11M3 19l1.5 1.5L7 18"/></svg>
          <span class="lbl">Call Order</span>
          <span class="badge count hidden" id="navCount">0</span>
        </a>
        <a href="#/data" data-route="data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span class="lbl">Data SAP</span>
        </a>
        <a href="#/pengaturan" data-route="pengaturan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span class="lbl">Pengaturan</span>
        </a>
      </nav>
      <div class="side-data" id="sideData"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Cari Material</h1>
          <div class="sub" id="pageSub"></div>
        </div>
        <div class="toolbar" id="pageActions"></div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="cartbar hidden" id="cartbar"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast-wrap" id="toasts"></div>
  <div class="loading hidden" id="loading"><div class="box"><div class="spinner"></div><div id="loadingText">Memproses…</div></div></div>
  <div class="login hidden" id="login"></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" multiple hidden>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/search.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/model.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>

</html>
